name: Release

# Push a tag like v0.16.0 (matching Version: in onedriver.spec) to build the
# RPMs and publish a GitHub release with them attached. See RELEASING.md.
on:
  push:
    tags: ["v*"]
  # Run by hand: without a tag, builds the RPMs from master as workflow
  # artifacts only (to try things out). With a tag, builds that release's
  # sources for the Fedora versions listed below and adds the RPMs to the
  # existing release (e.g. after adding a new Fedora version).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and add RPMs to, e.g. v0.16.0 (empty: build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  rpm:
    name: RPM for Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        # Fedora releases to build for: an RPM is built per release. Update
        # this list when Fedora versions come and go.
        fedora: ["43", "44", "45"]
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install git make rsync rpm-build golang gcc pkgconf-pkg-config \
            webkit2gtk4.1-devel json-glib-devel

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag matches the spec version
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^Version: *//p' onedriver.spec)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match Version: $version in onedriver.spec"
            exit 1
          fi

      - name: Build tarball and RPMs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^Version: *//p' onedriver.spec)
          make tarball
          rpmbuild -ta --define "_topdir $PWD/rpmbuild" onedriver-$version.tar.gz
          mkdir dist
          cp rpmbuild/RPMS/x86_64/*.rpm rpmbuild/SRPMS/*.src.rpm dist/
          # the source tarball is the same for every Fedora version: keep one
          if [ "${{ strategy.job-index }}" = "0" ]; then
            cp onedriver-$version.tar.gz dist/
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora-${{ matrix.fedora }}
          path: dist/

  release:
    name: Publish release
    needs: rpm
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*/*
          # only used when the release is created; an existing release keeps
          # its notes and gets the new or rebuilt files added
          generate_release_notes: true
