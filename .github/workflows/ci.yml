name: Tests
on:
  push:
  pull_request:

# Runs everything that works without a OneDrive account: formatting, vet,
# a full cgo build, unit tests and the end-to-end suite (fs/e2e), which
# mounts onedriver through FUSE against a fake Graph API. The live tests in
# ./fs, ./fs/graph and ./fs/offline need a signed-in account and are run by
# hand ("make test").
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwebkit2gtk-4.1-dev libjson-glib-dev fuse3

      - name: Check formatting
        run: test -z "$(gofmt -l cmd fs ui)" || (gofmt -l cmd fs ui; exit 1)

      - name: Build
        run: make onedriver onedriver-launcher

      - name: Vet
        run: CGO_CFLAGS=-Wno-deprecated-declarations go vet ./cmd/... ./fs/... ./ui/...

      - name: Unit tests
        run: go test -race -count=1 ./cmd/common ./fs/graph/quickxorhash ./fs/quota/... ./fs/partial/...

      - name: End-to-end tests (FUSE, fake Graph API)
        run: |
          CGO_CFLAGS=-Wno-deprecated-declarations go test -race -c -o e2e.test ./fs/e2e
          sudo ./e2e.test -test.v -test.count=1
