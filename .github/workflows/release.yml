name: Release

# Push a tag like v0.16.0 (matching Version: in onedriver.spec) to build the
# RPMs and publish a GitHub release with them attached. See RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # build the RPMs without releasing, to try things out

permissions:
  contents: write

jobs:
  rpm:
    name: RPM for Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        # Fedora releases to build for: an RPM is built per release. Update
        # this list when Fedora versions come and go.
        fedora: ["43", "44"]
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install git make rsync rpm-build golang gcc pkgconf-pkg-config \
            webkit2gtk4.1-devel json-glib-devel

      - uses: actions/checkout@v4

      - name: Check the tag matches the spec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^Version: *//p' onedriver.spec)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Version: $version in onedriver.spec"
            exit 1
          fi

      - name: Build tarball and RPMs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^Version: *//p' onedriver.spec)
          make tarball
          rpmbuild -ta --define "_topdir $PWD/rpmbuild" onedriver-$version.tar.gz
          mkdir dist
          cp rpmbuild/RPMS/x86_64/*.rpm rpmbuild/SRPMS/*.src.rpm dist/
          # the source tarball is the same for every Fedora version: keep one
          if [ "${{ strategy.job-index }}" = "0" ]; then
            cp onedriver-$version.tar.gz dist/
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora-${{ matrix.fedora }}
          path: dist/

  release:
    name: Publish release
    needs: rpm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true
